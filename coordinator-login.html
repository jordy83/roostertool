<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coördinator Login - RoosterTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('username').value.trim().toLowerCase();
            const wachtwoord = document.getElementById('password').value;
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const acc = accounts.find(a =>
                a.type === "medewerker" &&
                (a.naam.toLowerCase() === input || a.email.toLowerCase() === input) &&
                a.wachtwoord === wachtwoord
            );
            if (acc) {
                localStorage.setItem('actiefAccount', JSON.stringify(acc));
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('error').textContent = "Ongeldige login!";
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">Coördinator Login</h1>
        <form onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block mb-2 font-medium">Gebruikersnaam of e-mail</label>
                <input id="username" type="text" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500" required />
            </div>
            <div>
                <label class="block mb-2 font-medium">Wachtwoord</label>
                <input id="password" type="password" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500" required />
            </div>
            <div id="error" class="text-red-600 text-sm"></div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition-colors">
                Inloggen
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-blue-600 hover:underline">Terug naar homepage</a>
        </div>
    </div>
</body>
</html>
