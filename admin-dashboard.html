<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - RoosterTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-group { margin-bottom: 1rem; }
        .input-label { font-weight: 600; }
        .input { width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #d1d5db; }
    </style>
    <script>
        // Genereer een veilig wachtwoord
        function generatePassword(length = 10) {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*?";
            let password = "";
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        // Account opslaan in localStorage
        function saveAccount(e) {
            e.preventDefault();
            const naam = document.getElementById('naam').value.trim();
            const email = document.getElementById('email').value.trim();
            const wachtwoord = document.getElementById('wachtwoord').value;
            const functie = document.getElementById('functie').value;
            const isCoordinator = document.getElementById('isCoordinator').checked;
            const isAdmin = document.getElementById('isAdmin').checked;
            const klas = document.getElementById('klas').value.trim();

            if (!naam || !email || !wachtwoord) {
                alert("Naam, e-mail en wachtwoord zijn verplicht!");
                return;
            }

            const account = {
                naam,
                email,
                wachtwoord,
                functie,
                isCoordinator: functie === 'medewerker' ? isCoordinator : false,
                isAdmin: functie === 'medewerker' ? isAdmin : false,
                klas: functie === 'leerling' ? klas : ""
            };

            let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            accounts.push(account);
            localStorage.setItem('accounts', JSON.stringify(accounts));
            renderAccounts();
            e.target.reset();
            document.getElementById('wachtwoord').value = "";
        }

        // Wachtwoord genereren en invullen
        function vulWachtwoord() {
            document.getElementById('wachtwoord').value = generatePassword(12);
        }

        // Accounts tonen
        function renderAccounts() {
            const list = document.getElementById('accountList');
            list.innerHTML = "";
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            if (accounts.length === 0) {
                list.innerHTML = "<li class='text-gray-500'>Nog geen accounts aangemaakt.</li>";
                return;
            }
            accounts.forEach(acc => {
                list.innerHTML += `
                    <li class="p-4 mb-2 bg-white border rounded-lg shadow-sm">
                        <strong>${acc.naam}</strong> (${acc.email})<br/>
                        <span class="text-sm text-gray-700">Type: ${acc.functie}${acc.functie === "medewerker" ? 
                            (acc.isCoordinator ? ", Coördinator" : "") + (acc.isAdmin ? ", Admin" : "") : ""}${acc.functie === "leerling" && acc.klas ? ", Klas: " + acc.klas : ""}</span>
                    </li>
                `;
            });
        }

        // Initialiseren
        window.onload = () => {
            renderAccounts();
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <h1 class="text-2xl font-bold text-blue-600">RoosterTool Admin</h1>
            </div>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 transition-colors duration-200 ease-in-out">
                Uitloggen
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12 space-y-10">
        <section class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Account aanmaken</h2>
            <form id="accountForm" onsubmit="saveAccount(event)" class="space-y-4">
                <div class="input-group">
                    <label class="input-label">Naam</label>
                    <input type="text" id="naam" class="input" required />
                </div>
                <div class="input-group">
                    <label class="input-label">E-mail</label>
                    <input type="email" id="email" class="input" required />
                </div>
                <div class="input-group">
                    <label class="input-label">Wachtwoord</label>
                    <div class="flex gap-2">
                        <input type="text" id="wachtwoord" class="input" required />
                        <button type="button" onclick="vulWachtwoord()" class="bg-blue-600 text-white px-3 rounded hover:bg-blue-700">Genereer</button>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Functie / Type</label>
                    <select id="functie" class="input" onchange="document.getElementById('medewerkerOpties').style.display = this.value === 'medewerker' ? 'block' : 'none'; document.getElementById('leerlingOpties').style.display = this.value === 'leerling' ? 'block' : 'none';">
                        <option value="medewerker">Medewerker</option>
                        <option value="leerling">Leerling</option>
                    </select>
                </div>
                <div id="medewerkerOpties" style="display:block" class="input-group">
                    <label><input type="checkbox" id="isCoordinator" /> Coördinator</label>
                    <label class="ml-4"><input type="checkbox" id="isAdmin" /> Admin</label>
                </div>
                <div id="leerlingOpties" style="display:none" class="input-group">
                    <label class="input-label">Klas</label>
                    <input type="text" id="klas" class="input" placeholder="Bijv. 3A">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition-colors">
                    Account opslaan
                </button>
            </form>
        </section>

        <section class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Gemaakte accounts</h2>
            <ul id="accountList" class="space-y-2"></ul>
        </section>
    </main>
</body>
</html>
