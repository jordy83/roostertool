<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - RoosterTool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-link { cursor:pointer; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
    </style>
    <script>
        // Tabs
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('.tab-link').forEach(e => e.classList.remove('border-blue-600'));
            document.getElementById('tab-'+tab).classList.add('border-blue-600');
        }

        // Password generator
        function generatePassword(length = 10) {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*?";
            let password = "";
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        // Filter/search
        function filterAccounts() {
            const zoekterm = document.getElementById('zoekInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            renderAccounts(zoekterm, type);
        }

        // Accounts CRUD
        function saveAccount(e) {
            e.preventDefault();
            const id = document.getElementById('accId').value || Date.now().toString();
            const naam = document.getElementById('accNaam').value.trim();
            const email = document.getElementById('accEmail').value.trim();
            const wachtwoord = document.getElementById('accWachtwoord').value;
            const type = document.getElementById('accType').value;

            if (!naam || !email || !wachtwoord) {
                alert("Naam, e-mail en wachtwoord zijn verplicht!");
                return;
            }

            let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const idx = accounts.findIndex(a => a.id === id);

            const account = {id, naam, email, wachtwoord, type};

            if (idx > -1) {
                accounts[idx] = account;
            } else {
                accounts.push(account);
            }
            localStorage.setItem('accounts', JSON.stringify(accounts));
            renderAccounts();
            e.target.reset();
            document.getElementById('accId').value = "";
            document.getElementById('accWachtwoord').value = "";
        }

        function editAccount(id) {
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;
            document.getElementById('accId').value = acc.id;
            document.getElementById('accNaam').value = acc.naam;
            document.getElementById('accEmail').value = acc.email;
            document.getElementById('accWachtwoord').value = acc.wachtwoord;
            document.getElementById('accType').value = acc.type;
            window.scrollTo({top:0, behavior:"smooth"});
        }

        function deleteAccount(id) {
            if (!confirm("Weet je zeker dat je dit account wilt verwijderen?")) return;
            let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            accounts = accounts.filter(a => a.id !== id);
            localStorage.setItem('accounts', JSON.stringify(accounts));
            renderAccounts();
        }

        function vulWachtwoord() {
            document.getElementById('accWachtwoord').value = generatePassword(12);
        }

        // Inline bewerking
        function inlineEdit(id, veld, value) {
            let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const idx = accounts.findIndex(a => a.id === id);
            if (idx > -1) {
                accounts[idx][veld] = value;
                localStorage.setItem('accounts', JSON.stringify(accounts));
                renderAccounts();
            }
        }

        // Account overzicht met filter/search
        function renderAccounts(zoekterm = "", typeFilter = "alle") {
            const list = document.getElementById('accountList');
            list.innerHTML = "";
            let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            if (zoekterm) {
                accounts = accounts.filter(a =>
                    a.naam.toLowerCase().includes(zoekterm) ||
                    a.email.toLowerCase().includes(zoekterm)
                );
            }
            if (typeFilter !== "alle") {
                accounts = accounts.filter(a => a.type === typeFilter);
            }
            if (accounts.length === 0) {
                list.innerHTML = "<li class='text-gray-500'>Geen accounts gevonden.</li>";
                return;
            }
            accounts.forEach(acc => {
                list.innerHTML += `
                    <li class="p-4 mb-2 bg-white border rounded-lg shadow-sm flex flex-col md:flex-row md:justify-between md:items-center gap-2">
                        <div class="flex-1">
                            <strong>${acc.naam}</strong>
                            <input type="text" value="${acc.naam}" onchange="inlineEdit('${acc.id}', 'naam', this.value)" class="border rounded px-2 ml-2 w-32" title="Pas naam aan"/>
                            <br/>
                            <span class="text-sm text-gray-700">Email: <input type="text" value="${acc.email}" onchange="inlineEdit('${acc.id}', 'email', this.value)" class="border rounded px-2 w-40" title="Pas email aan"/></span><br />
                            <span class="text-sm text-gray-700">Wachtwoord: <input type="text" value="${acc.wachtwoord}" onchange="inlineEdit('${acc.id}', 'wachtwoord', this.value)" class="border rounded px-2 w-32" title="Pas wachtwoord aan"/></span><br />
                            <span class="text-sm text-gray-700">Type: 
                                <select onchange="inlineEdit('${acc.id}', 'type', this.value)" class="border rounded px-2">
                                    <option value="medewerker" ${acc.type === "medewerker" ? "selected":""}>Medewerker</option>
                                    <option value="leerling" ${acc.type === "leerling" ? "selected":""}>Leerling</option>
                                </select>
                            </span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editAccount('${acc.id}')" class="text-blue-600 hover:underline">Bewerk</button>
                            <button onclick="deleteAccount('${acc.id}')" class="text-red-600 hover:underline">Verwijder</button>
                        </div>
                    </li>
                `;
            });
        }

        window.onload = () => {
            showTab('accounts');
            renderAccounts();
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <h1 class="text-2xl font-bold text-blue-600">RoosterTool Admin</h1>
            </div>
            <a href="index.html" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 transition-colors duration-200 ease-in-out">
                Uitloggen
            </a>
        </div>
        <nav class="flex space-x-6 mt-2 px-6">
            <a onclick="showTab('accounts')" id="tab-accounts" class="tab-link text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent pb-2">Accounts</a>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12">
        <!-- Accounts Tab -->
        <section id="accounts" class="tab-content bg-white p-8 rounded-2xl shadow-lg border border-gray-200 active">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Accountbeheer</h2>
            <form id="accountForm" onsubmit="saveAccount(event)" class="space-y-4">
                <input type="hidden" id="accId" />
                <div>
                    <label class="block font-medium mb-1">Naam</label>
                    <input type="text" id="accNaam" class="w-full border-gray-300 rounded-md shadow-sm" required />
                </div>
                <div>
                    <label class="block font-medium mb-1">E-mail</label>
                    <input type="email" id="accEmail" class="w-full border-gray-300 rounded-md shadow-sm" required />
                </div>
                <div>
                    <label class="block font-medium mb-1">Wachtwoord</label>
                    <div class="flex gap-2">
                        <input type="text" id="accWachtwoord" class="w-full border-gray-300 rounded-md shadow-sm" required />
                        <button type="button" onclick="vulWachtwoord()" class="bg-blue-600 text-white px-3 rounded hover:bg-blue-700">Genereer</button>
                    </div>
                </div>
                <div>
                    <label class="block font-medium mb-1">Type</label>
                    <select id="accType" class="w-full border-gray-300 rounded-md shadow-sm">
                        <option value="medewerker">Medewerker</option>
                        <option value="leerling">Leerling</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition-colors">
                    Opslaan
                </button>
            </form>
            <div class="flex gap-4 mt-8 mb-2">
                <input type="text" id="zoekInput" placeholder="Zoek op naam of e-mail..." class="border rounded px-2 w-1/2" oninput="filterAccounts()"/>
                <select id="filterType" class="border rounded px-2" onchange="filterAccounts()" style="min-width:120px;">
                    <option value="alle">Alle types</option>
                    <option value="medewerker">Medewerker</option>
                    <option value="leerling">Leerling</option>
                </select>
            </div>
            <ul id="accountList" class="space-y-2"></ul>
        </section>
    </main>
</body>
</html>
