<!DOCTYPE html>
<html lang="nl">
<head>
    </head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <div class="flex justify-end mt-4">
        <button onclick="slaInschrijvingenOp()" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition-colors">Opslaan</button>
    </div>

    <script>
        // Bestaande DOM elementen
        const accountLijst = document.getElementById('accountLijst');
        const inschrijvingLijst = document.getElementById('inschrijvingLijst');
        const statistiekLijst = document.getElementById('statistiekLijst');
        const zoekInput = document.getElementById('zoekInput');
        const aangemaakteToetsenLijst = document.getElementById('aangemaakteToetsenLijst');
        const leerlingSelect = document.getElementById('leerlingSelect');
        const toetsSelect = document.getElementById('toetsSelect');
        const globalInschrijvingenCheckbox = document.getElementById('globalInschrijvingen');
        const geenInschrijvingenText = document.getElementById('geenInschrijvingen');
        const inschrijvingOpmerkingCoordinator = document.getElementById('inschrijvingOpmerkingCoordinator');
        
        // Hulpfuncties om gegevens uit localStorage op te halen en op te slaan
        function getFromLocalStorage(key, defaultValue = '[]') {
            try {
                return JSON.parse(localStorage.getItem(key) || defaultValue);
            } catch (e) {
                console.error(`Fout bij het parsen van localStorage-sleutel "${key}":`, e);
                return JSON.parse(defaultValue);
            }
        }

        function saveToLocalStorage(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        let sorteerRichting = {};
        let huidigeTab = 'accounts';

        // Functie voor tab navigatie
        function showTab(tabId) {
            huidigeTab = tabId;
            const tabs = document.querySelectorAll('.tab-content');
            const tabLinks = document.querySelectorAll('.tab-link');

            tabs.forEach(tab => tab.classList.add('hidden'));
            tabLinks.forEach(link => link.classList.remove('border-blue-600', 'text-blue-600'));

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('border-blue-600', 'text-blue-600');
            
            if (tabId === 'accounts') {
                toonAccounts();
            } else if (tabId === 'toetsen') {
                toonToetsen();
            } else if (tabId === 'inschrijvingen') {
                laadLeerlingenEnToetsen();
                toonInschrijvingen();
            }
        }

        // Initieel de eerste tab tonen
        document.addEventListener('DOMContentLoaded', () => {
            showTab('accounts');
            globalInschrijvingenCheckbox.checked = getFromLocalStorage('globaleInschrijvingenGesloten', 'false');
        });

        // Functies voor accounts
        function toonAccounts(filter = '') {
            accountLijst.innerHTML = '';
            const accounts = getFromLocalStorage('accounts');
            const gefilterdeAccounts = accounts.filter(account => account.naam.toLowerCase().includes(filter.toLowerCase()));

            gefilterdeAccounts.forEach(account => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center mb-2";
                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" data-account-email="${account.email}" class="account-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span>
                            <strong>${account.naam}</strong> uit klas <em>${account.klas}</em>
                            <br>
                            <span class="text-sm text-gray-500">${account.email}</span>
                        </span>
                    </div>
                    <div class="space-x-2 flex">
                        <button onclick="resetWachtwoord('${account.email}')" class="bg-indigo-500 text-white px-3 py-1 text-sm rounded-md hover:bg-indigo-600 transition-colors">Wachtwoord resetten</button>
                        <button onclick="bewerkAccount('${account.email}')" class="bg-yellow-500 text-white px-3 py-1 text-sm rounded-md hover:bg-yellow-600 transition-colors">Bewerken</button>
                        <button onclick="verwijderAccount('${account.email}')" class="bg-red-500 text-white px-3 py-1 text-sm rounded-md hover:bg-red-600 transition-colors">Verwijderen</button>
                    </div>
                `;
                accountLijst.appendChild(li);
            });
        }

        // Eventlistener voor de zoekbalk
        zoekInput.addEventListener('input', () => toonAccounts(zoekInput.value));

        // Functie voor het toevoegen van een account
        document.getElementById('accountForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const naam = document.getElementById('nieuweNaam').value;
            const klas = document.getElementById('nieuweKlas').value;
            const email = document.getElementById('nieuwEmail').value;
            const wachtwoord = document.getElementById('nieuwWachtwoord').value;
            
            const accounts = getFromLocalStorage('accounts');
            // Controleer op uniek e-mailadres
            if (accounts.some(acc => acc.email === email)) {
                alert("Er bestaat al een account met dit e-mailadres.");
                return;
            }

            accounts.push({ naam, klas, email, wachtwoord });
            saveToLocalStorage('accounts', accounts);
            
            toonAccounts();
            document.getElementById('accountForm').reset();
            const toevoegFeedback = document.getElementById('toevoegFeedback');
            toevoegFeedback.textContent = '✅ Account toegevoegd.';
            toevoegFeedback.classList.remove('hidden');
            setTimeout(() => toevoegFeedback.classList.add('hidden'), 3000);
        });

        // Functie voor het bewerken van een account
        function bewerkAccount(email) {
            const accounts = getFromLocalStorage('accounts');
            const account = accounts.find(acc => acc.email === email);
            if (!account) return;

            document.getElementById('editAccountForm').dataset.originalEmail = account.email;
            document.getElementById('editNaam').value = account.naam;
            document.getElementById('editKlas').value = account.klas;
            document.getElementById('editEmail').value = account.email;
            document.getElementById('editWachtwoord').value = '';

            document.getElementById('accountModal').classList.remove('hidden');
        }

        // Functie voor het opslaan van de bewerkte account
        document.getElementById('editAccountForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const originalEmail = document.getElementById('editAccountForm').dataset.originalEmail;
            const newNaam = document.getElementById('editNaam').value;
            const newKlas = document.getElementById('editKlas').value;
            const newEmail = document.getElementById('editEmail').value;
            const newWachtwoord = document.getElementById('editWachtwoord').value;
            
            const accounts = getFromLocalStorage('accounts');
            const index = accounts.findIndex(acc => acc.email === originalEmail);

            if (index !== -1) {
                // Controleer op uniek e-mailadres bij het bewerken
                if (newEmail !== originalEmail && accounts.some(acc => acc.email === newEmail)) {
                    alert("Er bestaat al een account met dit e-mailadres.");
                    return;
                }
                
                accounts[index].naam = newNaam;
                accounts[index].klas = newKlas;
                accounts[index].email = newEmail;
                if (newWachtwoord) {
                    accounts[index].wachtwoord = newWachtwoord;
                }
                saveToLocalStorage('accounts', accounts);
                toonAccounts();
            }
            
            document.getElementById('accountModal').classList.add('hidden');
        });

        // Functie voor het verwijderen van een account
        function verwijderAccount(email) {
            if (confirm("Weet je zeker dat je dit account wilt verwijderen?")) {
                let accounts = getFromLocalStorage('accounts');
                accounts = accounts.filter(acc => acc.email !== email);
                saveToLocalStorage('accounts', accounts);
                toonAccounts();
            }
        }

        // Functie om alle accounts te verwijderen
        function resetAccounts() {
            if (confirm("Weet je zeker dat je ALLE leerlingaccounts wilt verwijderen? Dit kan niet ongedaan worden gemaakt.")) {
                localStorage.removeItem('accounts');
                toonAccounts();
                alert("Alle accounts zijn verwijderd.");
            }
        }
        
        // Functie voor het versturen van wachtwoorden
        function stuurWachtwoorden(type) {
            const accounts = getFromLocalStorage('accounts');
            let geselecteerdeEmails = [];

            if (type === 'geselecteerd') {
                document.querySelectorAll('.account-checkbox:checked').forEach(checkbox => {
                    geselecteerdeEmails.push(checkbox.dataset.accountEmail);
                });
            } else {
                geselecteerdeEmails = accounts.map(acc => acc.email);
            }
            
            if (geselecteerdeEmails.length === 0) {
                alert("Geen accounts geselecteerd.");
                return;
            }
            
            const accountsToSend = accounts.filter(acc => geselecteerdeEmails.includes(acc.email));
            
            let bericht = "Wachtwoorden verstuurd naar:\n\n";
            accountsToSend.forEach(acc => {
                bericht += `${acc.naam} (${acc.email}): ${acc.wachtwoord}\n`;
            });
            
            alert(bericht);
        }

        // Functies voor toetsen
        function toonToetsen() {
            const toetsen = getFromLocalStorage('toetsen');
            aangemaakteToetsenLijst.innerHTML = '';
            if (toetsen.length === 0) {
                aangemaakteToetsenLijst.innerHTML = '<li>Nog geen toetsen aangemaakt.</li>';
            } else {
                toetsen.forEach((toets, index) => {
                    const status = toets.gesloten ? "Gesloten" : "Open";
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center mb-2";
                    li.innerHTML = `
                        <span><strong>${toets.vak} (${toets.toetsnr})</strong> - ${toets.klas} (${toets.soort}, ${toets.duur}) | Deadline: ${toets.deadline ? new Date(toets.deadline).toLocaleString('nl-NL') : 'Geen'} | Status: ${status}</span>
                        <div class="space-x-2 flex">
                            <button onclick="bewerkToets(${index})" class="bg-yellow-500 text-white px-3 py-1 text-sm rounded-md hover:bg-yellow-600 transition-colors">Bewerken</button>
                            <button onclick="verwijderToets(${index})" class="bg-red-500 text-white px-3 py-1 text-sm rounded-md hover:bg-red-600 transition-colors">Verwijderen</button>
                        </div>
                    `;
                    aangemaakteToetsenLijst.appendChild(li);
                });
            }
        }

        // Functie voor het toevoegen van een toets
        document.getElementById('toetsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const toets = {
                vak: document.getElementById('toetsVak').value,
                toetsnr: document.getElementById('toetsNr').value,
                soort: document.getElementById('toetsSoort').value,
                duur: document.getElementById('toetsDuur').value,
                klas: document.getElementById('toetsKlas').value,
                deadline: document.getElementById('toetsDeadline').value,
                gesloten: document.getElementById('toetsGesloten').checked,
            };
            
            const toetsen = getFromLocalStorage('toetsen');
            toetsen.push(toets);
            saveToLocalStorage('toetsen', toetsen);
            
            toonToetsen();
            document.getElementById('toetsForm').reset();
            const toetsFeedback = document.getElementById('toetsFeedback');
            toetsFeedback.textContent = '✅ Toets succesvol aangemaakt.';
            toetsFeedback.classList.remove('hidden');
            setTimeout(() => toetsFeedback.classList.add('hidden'), 3000);
        });

        // Functie voor het bewerken van een toets
        function bewerkToets(index) {
            const toetsen = getFromLocalStorage('toetsen');
            const toets = toetsen[index];
            if (!toets) return;

            document.getElementById('editToetsForm').dataset.index = index;
            document.getElementById('editVak').value = toets.vak;
            document.getElementById('editToetsnr').value = toets.toetsnr;
            document.getElementById('editSoort').value = toets.soort;
            document.getElementById('editDuur').value = toets.duur;
            document.getElementById('editKlas').value = toets.klas;
            document.getElementById('editDeadline').value = toets.deadline;
            document.getElementById('editToetsGesloten').checked = toets.gesloten;

            document.getElementById('toetsModal').classList.remove('hidden');
        }

        // Functie voor het opslaan van de bewerkte toets
        document.getElementById('editToetsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const index = document.getElementById('editToetsForm').dataset.index;
            const toetsen = getFromLocalStorage('toetsen');
            if (toetsen[index]) {
                toetsen[index] = {
                    vak: document.getElementById('editVak').value,
                    toetsnr: document.getElementById('editToetsnr').value,
                    soort: document.getElementById('editSoort').value,
                    duur: document.getElementById('editDuur').value,
                    klas: document.getElementById('editKlas').value,
                    deadline: document.getElementById('editDeadline').value,
                    gesloten: document.getElementById('editToetsGesloten').checked,
                };
                saveToLocalStorage('toetsen', toetsen);
                toonToetsen();
            }
            document.getElementById('toetsModal').classList.add('hidden');
        });

        // Functie voor het verwijderen van een toets
        function verwijderToets(index) {
            if (confirm("Weet je zeker dat je deze toets wilt verwijderen?")) {
                let toetsen = getFromLocalStorage('toetsen');
                toetsen.splice(index, 1);
                saveToLocalStorage('toetsen', toetsen);
                toonToetsen();
            }
        }

        // Functie voor het resetten van alle toetsen
        function resetToetsen() {
            if (confirm("Weet je zeker dat je ALLE toetsen wilt verwijderen? Dit kan niet ongedaan worden gemaakt.")) {
                localStorage.removeItem('toetsen');
                toonToetsen();
                alert("Alle toetsen zijn verwijderd.");
            }
        }

        // Functies voor inschrijvingen en statistieken
        function laadLeerlingenEnToetsen() {
            const accounts = getFromLocalStorage('accounts');
            const toetsen = getFromLocalStorage('toetsen');

            leerlingSelect.innerHTML = '<option value="">-- Selecteer een leerling --</option>';
            accounts.forEach(account => {
                const option = document.createElement('option');
                option.value = account.email;
                option.textContent = `${account.naam} (${account.klas})`;
                leerlingSelect.appendChild(option);
            });

            toetsSelect.innerHTML = '<option value="">-- Selecteer een toets --</option>';
            toetsen.forEach(toets => {
                const option = document.createElement('option');
                option.value = `${toets.vak} (${toets.toetsnr})`;
                option.textContent = `${toets.vak} (${toets.toetsnr}) - ${toets.klas}`;
                toetsSelect.appendChild(option);
            });
        }

        function toonInschrijvingen() {
            const inschrijvingen = getFromLocalStorage('inschrijvingen');
            const losseInschrijvingen = [];

            inschrijvingen.forEach(leerlingInschrijving => {
                leerlingInschrijving.toetsen.forEach(toetsObject => {
                    losseInschrijvingen.push({
                        leerling: leerlingInschrijving.naam,
                        klas: leerlingInschrijving.klas,
                        toets: toetsObject.titel,
                        ingeschrevenDoor: toetsObject.ingeschrevenDoor || 'Leerling',
                        opmerkingCoordinator: toetsObject.opmerkingen?.coordinator || '',
                        opmerkingLeerling: toetsObject.opmerkingen?.leerling || '',
                        bevroren: toetsObject.bevroren || false,
                    });
                });
            });

            let gesorteerdeLijst = losseInschrijvingen;
            if (sorteerRichting.kolom) {
                gesorteerdeLijst.sort((a, b) => {
                    const valA = a[sorteerRichting.kolom].toLowerCase();
                    const valB = b[sorteerRichting.kolom].toLowerCase();
                    if (valA < valB) return sorteerRichting.richting === 'asc' ? -1 : 1;
                    if (valA > valB) return sorteerRichting.richting === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            inschrijvingLijst.innerHTML = '';
            if (gesorteerdeLijst.length === 0) {
                geenInschrijvingenText.classList.remove('hidden');
            } else {
                geenInschrijvingenText.classList.add('hidden');
                gesorteerdeLijst.forEach((inschrijving) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50";
                    tr.innerHTML = `
                        <td class="py-3 px-4">${inschrijving.leerling}</td>
                        <td class="py-3 px-4">${inschrijving.klas}</td>
                        <td class="py-3 px-4">${inschrijving.toets}</td>
                        <td class="py-3 px-4">${inschrijving.ingeschrevenDoor}</td>
                        <td class="py-3 px-4">
                            <input type="checkbox" onchange="markeerAlsGewijzigd()" data-leerling="${inschrijving.leerling}" data-toets="${inschrijving.toets}" ${inschrijving.bevroren ? 'checked' : ''} class="bevries-checkbox h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        </td>
                        <td class="py-3 px-4 whitespace-pre-wrap">
                            <div class="flex items-center space-x-2">
                                <span>${inschrijving.opmerkingCoordinator}</span>
                                <button onclick="bewerkOpmerkingCoordinator('${inschrijving.leerling}', '${inschrijving.toets}')" class="bg-indigo-500 text-white px-3 py-1 text-sm rounded-md hover:bg-indigo-600 transition-colors">✏️</button>
                            </div>
                        </td>
                        <td class="py-3 px-4 whitespace-pre-wrap">${inschrijving.opmerkingLeerling}</td>
                        <td class="py-3 px-4">
                            <button onclick="verwijderInschrijving('${inschrijving.leerling}', '${inschrijving.toets}')" class="bg-red-500 text-white px-3 py-1 text-sm rounded-md hover:bg-red-600 transition-colors">Verwijder</button>
                        </td>
                    `;
                    inschrijvingLijst.appendChild(tr);
                });
            }
        }
        
        // Functie om wijzigingen te markeren voor opslag
        let wijzigingenInWachtrij = false;
        function markeerAlsGewijzigd() {
            wijzigingenInWachtrij = true;
        }

        // Functie voor het sorteren van de tabel
        function sorteerTabel(kolom) {
            if (sorteerRichting.kolom === kolom) {
                sorteerRichting.richting = sorteerRichting.richting === 'asc' ? 'desc' : 'asc';
            } else {
                sorteerRichting.kolom = kolom;
                sorteerRichting.richting = 'asc';
            }
            toonInschrijvingen();
        }

        // Functie voor het handmatig inschrijven van een leerling
        function schrijfLeerlingIn() {
            const leerlingEmail = leerlingSelect.value;
            const toetsTitel = toetsSelect.value;
            const opmerkingCoordinator = inschrijvingOpmerkingCoordinator.value;

            if (!leerlingEmail || !toetsTitel) {
                alert("Selecteer een leerling en een toets.");
                return;
            }

            let inschrijvingen = getFromLocalStorage('inschrijvingen');
            const account = getFromLocalStorage('accounts').find(acc => acc.email === leerlingEmail);
            if (!account) return;

            let leerlingInschrijving = inschrijvingen.find(i => i.email === leerlingEmail);

            if (!leerlingInschrijving) {
                leerlingInschrijving = {
                    naam: account.naam,
                    klas: account.klas,
                    email: account.email,
                    toetsen: []
                };
                inschrijvingen.push(leerlingInschrijving);
            }
            
            // Voorkom dubbele inschrijvingen
            const alIngeschreven = leerlingInschrijving.toetsen.some(t => t.titel === toetsTitel);
            if (alIngeschreven) {
                alert("Deze leerling is al ingeschreven voor deze toets.");
                return;
            }
            
            leerlingInschrijving.toetsen.push({
                titel: toetsTitel,
                ingeschrevenDoor: 'Coördinator',
                opmerkingen: {
                    coordinator: opmerkingCoordinator,
                    leerling: ''
                },
                bevroren: true // Handmatige inschrijvingen zijn standaard bevroren
            });

            saveToLocalStorage('inschrijvingen', inschrijvingen);
            toonInschrijvingen();
            
            const inschrijvingFeedback = document.getElementById('inschrijvingFeedback');
            inschrijvingFeedback.classList.remove('hidden');
            setTimeout(() => inschrijvingFeedback.classList.add('hidden'), 3000);
        }

        // Functie om de "bevries"-status te verwerken en op te slaan
        function slaInschrijvingenOp() {
            const checkboxes = document.querySelectorAll('.bevries-checkbox');
            let inschrijvingen = getFromLocalStorage('inschrijvingen');

            checkboxes.forEach(checkbox => {
                const leerlingNaam = checkbox.dataset.leerling;
                const toetsTitel = checkbox.dataset.toets;
                const isBevroren = checkbox.checked;
                
                const inschrijving = inschrijvingen.find(i => i.naam === leerlingNaam);
                if (inschrijving) {
                    const toets = inschrijving.toetsen.find(t => t.titel === toetsTitel);
                    if (toets) {
                        toets.bevroren = isBevroren;
                    }
                }
            });

            saveToLocalStorage('inschrijvingen', inschrijvingen);
            alert("Wijzigingen succesvol opgeslagen.");
            toonInschrijvingen();
            wijzigingenInWachtrij = false;
        }

        // Functie om inschrijving te verwijderen
        function verwijderInschrijving(leerlingNaam, toetsTitel) {
            if (confirm("Weet je zeker dat je deze inschrijving wilt verwijderen?")) {
                let inschrijvingen = getFromLocalStorage('inschrijvingen');
                const inschrijvingIndex = inschrijvingen.findIndex(i => i.naam === leerlingNaam);
                if (inschrijvingIndex !== -1) {
                    inschrijvingen[inschrijvingIndex].toetsen = inschrijvingen[inschrijvingIndex].toetsen.filter(t => t.titel !== toetsTitel);
                    if (inschrijvingen[inschrijvingIndex].toetsen.length === 0) {
                        inschrijvingen.splice(inschrijvingIndex, 1);
                    }
                    saveToLocalStorage('inschrijvingen', inschrijvingen);
                    toonInschrijvingen();
                }
            }
        }

        // Functie om alle inschrijvingen te verwijderen
        function resetInschrijvingen() {
            if (confirm("Weet je zeker dat je ALLE inschrijvingen wilt verwijderen? Dit kan niet ongedaan worden gemaakt.")) {
                localStorage.removeItem('inschrijvingen');
                toonInschrijvingen();
                alert("Alle inschrijvingen zijn verwijderd.");
            }
        }
        
        // Functie om opmerkingen van coördinator te bewerken
        function bewerkOpmerkingCoordinator(leerlingNaam, toetsTitel) {
            let inschrijvingen = getFromLocalStorage('inschrijvingen');
            const inschrijving = inschrijvingen.find(i => i.naam === leerlingNaam);
            if (inschrijving) {
                const toets = inschrijving.toetsen.find(t => t.titel === toetsTitel);
                if (toets) {
                    document.getElementById('opmerkingModalTitel').textContent = `Bewerk opmerking voor ${leerlingNaam} - ${toetsTitel}`;
                    document.getElementById('opmerkingModalLeerling').value = leerlingNaam;
                    document.getElementById('opmerkingModalToets').value = toetsTitel;
                    document.getElementById('opmerkingModalTekst').value = toets.opmerkingen?.coordinator || '';
                    document.getElementById('opmerkingModal').classList.remove('hidden');
                }
            }
        }

        // Functie om de opmerking van de coördinator op te slaan
        function opslaanOpmerkingCoordinator() {
            const leerlingNaam = document.getElementById('opmerkingModalLeerling').value;
            const toetsTitel = document.getElementById('opmerkingModalToets').value;
            const nieuweOpmerking = document.getElementById('opmerkingModalTekst').value;

            let inschrijvingen = getFromLocalStorage('inschrijvingen');
            const inschrijving = inschrijvingen.find(i => i.naam === leerlingNaam);
            if (inschrijving) {
                const toets = inschrijving.toetsen.find(t => t.titel === toetsTitel);
                if (toets) {
                    if (!toets.opmerkingen) {
                        toets.opmerkingen = {};
                    }
                    toets.opmerkingen.coordinator = nieuweOpmerking;
                    saveToLocalStorage('inschrijvingen', inschrijvingen);
                    toonInschrijvingen();
                }
            }
            document.getElementById('opmerkingModal').classList.add('hidden');
        }

        // Functie om CSV te exporteren
        function exportCSV() {
            const inschrijvingen = getFromLocalStorage('inschrijvingen');
            const headers = ["Leerling", "Klas", "Toets", "Ingeschreven door", "Bevroren", "Opmerking Coördinator", "Opmerking Leerling"];
            
            let csvContent = headers.join(";") + "\n";
            
            inschrijvingen.forEach(leerlingInschrijving => {
                leerlingInschrijving.toetsen.forEach(toetsObject => {
                    const row = [
                        `"${leerlingInschrijving.naam}"`,
                        `"${leerlingInschrijving.klas}"`,
                        `"${toetsObject.titel}"`,
                        `"${toetsObject.ingeschrevenDoor || 'Leerling'}"`,
                        `"${toetsObject.bevroren ? 'Ja' : 'Nee'}"`,
                        `"${(toetsObject.opmerkingen?.coordinator || '').replace(/"/g, '""')}"`,
                        `"${(toetsObject.opmerkingen?.leerling || '').replace(/"/g, '""')}"`
                    ];
                    csvContent += row.join(";") + "\n";
                });
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "inschrijvingen.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Functie om CSV te importeren
        document.getElementById('importeerBtn').addEventListener('click', () => {
            const file = document.getElementById('csvFileInput').files[0];
            if (!file) {
                alert("Selecteer een CSV-bestand.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const regels = text.split('\n').filter(line => line.trim() !== '');
                if (regels.length === 0) {
                    alert("Het CSV-bestand is leeg.");
                    return;
                }

                const headers = regels[0].toLowerCase().split(';').map(h => h.trim());
                const verplichteHeaders = ['vak', 'toetsnr', 'soort', 'duur', 'klas', 'deadline'];
                
                const heeftAlleHeaders = verplichteHeaders.every(h => headers.includes(h));
                if (!heeftAlleHeaders) {
                    alert("CSV-bestand heeft niet de juiste kopjes: vak,toetsnr,soort,duur,klas,deadline");
                    return;
                }

                const nieuweToetsen = [];
                for (let i = 1; i < regels.length; i++) {
                    const waarden = regels[i].split(';');
                    const toets = {};
                    headers.forEach((header, index) => {
                        const waarde = waarden[index]?.trim() || '';
                        toets[header] = waarde;
                    });

                    if (toets.deadline) {
                        toets.deadline = new Date(toets.deadline).toISOString().slice(0, 16);
                    } else {
                        delete toets.deadline;
                    }
                    toets.gesloten = false;
                    nieuweToetsen.push(toets);
                }
                
                let bestaandeToetsen = getFromLocalStorage('toetsen');
                bestaandeToetsen = bestaandeToetsen.concat(nieuweToetsen);
                saveToLocalStorage('toetsen', bestaandeToetsen);
                
                toonToetsen();
                const importFeedback = document.getElementById('importFeedback');
                importFeedback.textContent = '✅ Toetsen succesvol geïmporteerd.';
                importFeedback.classList.remove('hidden');
                setTimeout(() => importFeedback.classList.add('hidden'), 3000);
            };
            reader.readAsText(file);
        });

        // Functie om globale instellingen op te slaan
        function slaGlobaleInstellingenOp() {
            saveToLocalStorage('globaleInschrijvingenGesloten', globalInschrijvingenCheckbox.checked);
            alert("Instellingen succesvol opgeslagen.");
        }

        // Functie voor het resetten van wachtwoord
        function resetWachtwoord(email) {
            let accounts = getFromLocalStorage('accounts');
            const account = accounts.find(acc => acc.email === email);
            if (account) {
                const nieuwWachtwoord = prompt("Voer het nieuwe wachtwoord in voor " + account.naam + ":");
                if (nieuwWachtwoord) {
                    account.wachtwoord = nieuwWachtwoord;
                    saveToLocalStorage('accounts', accounts);
                    alert(`Wachtwoord voor ${account.naam} is gereset.`);
                    toonAccounts();
                }
            }
        }
    </script>
